<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the ISS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Where is the ISS?</h1>
    <p>
        latitude: <span id="lat"></span><br />
        longitude: <span id="long"></span>
    </p>

    <div id="issMap"></div>

    <p>By using the Leaflet library and CSV data from <a rel="noopener noreferrer" href="https://api.wheretheiss.at/v1/satellites/25544" target="_blank">api.wheretheiss.at/v1/satellites/25544</a>, we can track the International Space Station in real-time!</p>

    <script src="script.js"></script>
</body>
</html>
